 no separate stub on the rear pod. Front pod keeps Rev 011c stubs.</text><text x="12.0" y="171.2" font-size="2.45" fill="#000" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial">NEW AXLE: 125 behind the cut line, 20 above the leg bottom edge (old height). Wheel moves 55 rearward. Belt arc clears the cut edge 14.</text><text x="12.0" y="175.0" font-size="2.45" fill="#000" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial">ORDER: cut legs > bolt snug > hang pod > belt on > hand-run > then perimeter-weld pad-to-leg and plate-to-carrier.</text><line x1="12.0" y1="184.8" x2="162.0" y2="184.8" stroke="#000" stroke-width="0.35"/><line x1="12.0" y1="184.8" x2="12.0" y2="179.8" stroke="#000" stroke-width="0.3"/><line x1="22.0" y1="184.8" x2="22.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="32.0" y1="184.8" x2="32.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="42.0" y1="184.8" x2="42.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="52.0" y1="184.8" x2="52.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="62.0" y1="184.8" x2="62.0" y2="179.8" stroke="#000" stroke-width="0.3"/><line x1="72.0" y1="184.8" x2="72.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="82.0" y1="184.8" x2="82.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="92.0" y1="184.8" x2="92.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="102.0" y1="184.8" x2="102.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="112.0" y1="184.8" x2="112.0" y2="179.8" stroke="#000" stroke-width="0.3"/><line x1="122.0" y1="184.8" x2="122.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="132.0" y1="184.8" x2="132.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="142.0" y1="184.8" x2="142.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="152.0" y1="184.8" x2="152.0" y2="181.8" stroke="#000" stroke-width="0.3"/><line x1="162.0" y1="184.8" x2="162.0" y2="179.8" stroke="#000" stroke-width="0.3"/><tex
