" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">“up” = mm from the BOTTOM edge of the bar</text><text x="113.000" y="77.600" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">(the left edge in this drawing).</text><text x="113.000" y="81.700" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">Key: drill Ø10.4, file two flats 8.9 apart,</text><text x="113.000" y="85.800" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">parallel to the bar edges. No slot.</text><text x="113.000" y="89.900" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">Rear-pod HUB PLATE: drill Ø8.4 at 44 mm from</text><text x="113.000" y="94.000" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">its top end. Bolt + key, then weld all round.</text><text x="113.000" y="102.100" font-family="Helvetica, Arial, sans-serif" font-size="2.8" fill="#000" text-anchor="start" font-weight="bold">HOLES (from the front end · up)</text><line x1="113.000" y1="103.500" x2="195.000" y2="103.500" stroke="#666" stroke-width="0.2"/><text x="113.000" y="107.500" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">Ø13 — M12 into the rail</text><text x="195.000" y="107.500" font-family="Menlo, monospace" font-size="2.6" fill="#000" text-anchor="end" font-weight="normal">20.0 · 30.0 up</text><text x="113.000" y="111.500" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#000" text-anchor="start" font-weight="normal">Ø13 — M12 into the rail</text><text x="195.000" y="111.500" font-family="Menlo, monospace" font-size="2.6" fill="#000" text-anchor="end" font-weight="normal">80.0 · 3
